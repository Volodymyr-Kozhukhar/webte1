<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Z čoho sa skladá plaz</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Z čoho sa sklada plaz</h1>

    <figure class="hotspot-image">
        <!--link to image https://www.vecteezy.com/photo/11826370-maldives-islands-ocean-tropical-beach-exotic-sea-lagoon-palm-trees-over-white-sand-idyllic-nature-landscape-amazing-beach-scenic-shore-bright-tropical-summer-sun-and-blue-sky-with-light-clouds -->
      <img src="img/beach.jpg" alt="Ilustrácia Maldiv z pravého boku" width="1050" height="700">

      <div class="hotspot" style="--x: 25%; --y: 65%">
        <button class="hotspot__dot" type="button" aria-label="Zadné koleso"></button>
        <div class="hotspot__panel">
          <h2>Zadné koleso</h2>
          <p>V strede kolesa sú ozubené kolieska pre reťaz. Podľa toho, na ktorom je reťaz, sa šliape ľahšie alebo ťažšie.</p>
        </div>
      </div>

      <div class="hotspot" style="--x: 27.5%; --y: 75.5%">
        <button class="hotspot__dot" type="button" aria-label="Prehadzovačka"></button>
        <div class="hotspot__panel">
          <h2>Prehadzovačka</h2>
          <p>Pri preraďovaní presúva reťaz z jedného ozubeného kolieska na druhé.</p>
        </div>
      </div>

      <div class="hotspot" style="--x: 70%; --y: 23.75%">
        <button class="hotspot__dot" type="button" aria-label="Riadidlá"></button>
        <div class="hotspot__panel">
          <h2>Riadidlá</h2>
          <p>Sú na nich brzdové páky a radenie.</p>
        </div>
      </div>
    </figure>

    <p>Text pod obrázkom, aby bolo vidieť, čo sa deje s obsahom pod ním.</p>
  </main>
</body>
</html>
